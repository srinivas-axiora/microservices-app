services:
  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - catalog-service
      - cart-service
      - shipping-service
    networks:
      - frontend-network

  # 0. Frontend React App
  frontend:
    build:
      context: ./frontend/ecommerce-frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    depends_on:
      - catalog-service
      - cart-service
      - shipping-service
    networks:
      - frontend-network

  # 1. Catalog Service (Java Spring Boot + PostgreSQL)
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres_catalog
      - DB_PORT=5432
      - DB_NAME=${CATALOG_DB_NAME}
      - DB_USER=${CATALOG_DB_USER}
      - DB_PASSWORD=${CATALOG_DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_catalog:5432/${CATALOG_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${CATALOG_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${CATALOG_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres_catalog:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  postgres_catalog:
    image: postgres:15-alpine
    container_name: postgres_catalog
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${CATALOG_DB_USER}
      - POSTGRES_PASSWORD=${CATALOG_DB_PASSWORD}
      - POSTGRES_DB=${CATALOG_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 2. Cart Service (Python FastAPI + MongoDB)
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongo_cart
      - MONGO_PORT=27017
      - MONGO_DB=${CART_MONGO_DB}
      - MONGO_USER=${CART_MONGO_USER}
      - MONGO_PASSWORD=${CART_MONGO_PASSWORD}
      - MONGO_URI=mongodb://${CART_MONGO_USER}:${CART_MONGO_PASSWORD}@mongo_cart:27017/${CART_MONGO_DB}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongo_cart:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  mongo_cart:
    image: mongo:6.0
    container_name: mongo_cart
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${CART_MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${CART_MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${CART_MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_cart_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 3. Shipping Service (Node.js Express + PostgreSQL)
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: shipping-service
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_HOST=postgres_shipping
      - DB_PORT=5432
      - DB_NAME=${SHIPPING_DB_NAME}
      - DB_USER=${SHIPPING_DB_USER}
      - DB_PASSWORD=${SHIPPING_DB_PASSWORD}
      - POSTGRES_URI=postgres://${SHIPPING_DB_USER}:${SHIPPING_DB_PASSWORD}@postgres_shipping:5432/${SHIPPING_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres_shipping:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  postgres_shipping:
    image: postgres:15-alpine
    container_name: postgres_shipping
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${SHIPPING_DB_USER}
      - POSTGRES_PASSWORD=${SHIPPING_DB_PASSWORD}
      - POSTGRES_DB=${SHIPPING_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_shipping_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIPPING_DB_USER} -d ${SHIPPING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 4. PgAdmin Web Dashboard
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dashboard
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_shipping
      - postgres_catalog
    networks:
      - backend-network

  # 5. Jenkins CI/CD Automation Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  postgres_catalog_data:
  postgres_shipping_data:
  mongo_cart_data:
  jenkins_home:

